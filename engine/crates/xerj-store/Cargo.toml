[package]
name = "xerj-store"
description = "XERJ-R connected memory: versioned record store (MVCC-lite revisions, Python-exact semantics), append-only log, checkpoints"
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hashbrown = "0.17"
foldhash = "0.2"
smallvec = { version = "1.15", features = ["const_generics", "union"] }
unicode-normalization = "0.1"
memmap2 = "0.9"
crc32fast = "1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "store_bench"
harness = false
