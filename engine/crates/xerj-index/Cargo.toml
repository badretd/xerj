[package]
name = "xerj-index"
description = "XERJ-R connected memory: entity linker, subject/relation indexes, exact candidate + per-hop manifests, segmented BM25 over the same store"
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[dependencies]
xerj-store = { path = "../xerj-store" }
aho-corasick = "1.1"
sha2 = "0.11"
hashbrown = "0.17"
foldhash = "0.2"
smallvec = { version = "1.15", features = ["const_generics", "union"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "index_bench"
harness = false
