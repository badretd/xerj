[package]
name = "xerj-facts"
description = "XERJ-R facts store, exact executor and compiler inside the engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[features]
# Test-only crash points at the commit and recovery steps (`src/failpoint.rs`, gate E4). Off by default and in no shipped
# feature set: without it every point is a no-op.
failpoints = []

# The XERJ-R crates live next to this one and stay outside the workspace (see engine/Cargo.toml).
[dependencies]
xerj-store = { path = "../xerj-store" }
xerj-index = { path = "../xerj-index" }
xerj-exec = { path = "../xerj-exec" }
xerj-infer = { path = "../xerj-infer", default-features = false }
xerj-serve = { path = "../xerj-serve", default-features = false }
# the engine's own tokenizer build (the same version and features as xerj-ai): no tokenizers 0.22 / onig in the product
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# the WriteSink signatures (the same spec as xerj-store: no new version or feature in Cargo.lock)
smallvec = { version = "1.15", features = ["const_generics", "union"] }
